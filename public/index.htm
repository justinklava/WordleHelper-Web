<!DOCTYPE html>
<html>
<head>
  <title>Wordle Helper</title>
  <link rel="stylesheet" type="text/css" href="index.css" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <script defer type="text/javascript" src="index.js"></script>
</head>
<body>
  <header id="header">
  </header>
  <section id="section-main">
    <form id="form-index" name="form-index">
      <label for="">Letters in correct place: </label><input type="text" id="green-letter-1" name="green-letter-1" maxlength="1" size="1" class="green-letters" /><input type="text" id="green-letter-2" name="green-letter-2" maxlength="1" size="1" class="green-letters" /><input type="text" id="green-letter-3" name="green-letter-3" maxlength="1" size="1" class="green-letters"/><input type="text" id="green-letter-4" name="green-letter-4" maxlength="1" size="1" class="green-letters" /><input type="text" id="green-letter-5" name="green-letter-5" maxlength="1" size="1" class="green-letters" /><br />
      <label for="yellow-letters">Letters in word but wrong place: </label><input type="text" id="yellow-letter-1" name="yellow-letter-1" size="5" maxlength="5" class="yellow-letters" /><input type="text" id="yellow-letter-2" name="yellow-letter-2" size="5" maxlength="5" class="yellow-letters" /><input type="text" id="yellow-letter-3" name="yellow-letter-3" size="5" maxlength="5" class="yellow-letters" /><input type="text" id="yellow-letter-4" name="yellow-letter-4" size="5" maxlength="5" class="yellow-letters" /><input type="text" id="yellow-letter-5" name="yellow-letter-5" size="5" maxlength="5" class="yellow-letters" /><br />
      <label for="grey-letters">Letters not in word: </label><input type="text" id="grey-letters" name="grey-letters" /><br />
      <button type="submit" id="submit" name="submit">Get Help</button>
    </form>
    <div id="possible-words">
    </div>
  </section>
  <footer id="footer">
  </footer>
</body>
</html>
